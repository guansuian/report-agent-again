# 报表 agent 配置 —— 对应真实 deer-flow 根目录的 config.yaml（这里只保留最小段落）

models:
  - name: deepseek-flash
    provider: langchain_openai
    api_key: $DEEPSEEK_API_KEY
    base_url: https://api.deepseek.com
    supports_vision: false
    supports_thinking: true
#  - name: gpt-4o
#    provider: langchain_openai
#    supports_vision: true
#    supports_thinking: true

agents:
  - name: default
    model: null
    skills: null
    memory_enabled: true

authorization:
  enabled: false
  fail_closed: false
  default_role: user

database:
  backend: postgres
  postgres_url: $DATABASE_URL

memory:
  # 填写 .env 中的密钥并确认 PostgreSQL 可用后，再启用长期记忆。
  enabled: true
  top_k: 5
  max_injection_chars: 6000
  # 相对 backend/packages/harness 目录；启动时读取正文，修改后需重启后端。
  custom_instructions_file: core/agents/memory/custom_instructions.md
  # mem0 OSS 配置：记忆存储复用现有 PostgreSQL，使用独立的记忆表。
  backend_config:
    llm:
      provider: deepseek  # 使用 mem0 内置适配器提炼长期记忆。
      config:
        model: deepseek-flash
        api_key: $DEEPSEEK_API_KEY  # 复用 .env 中已有的 DeepSeek 密钥。
        deepseek_base_url: https://api.deepseek.com
        temperature: 0
        max_tokens: 4096
    embedder:
      provider: openai  # 使用 mem0 内置适配器调用千问的 OpenAI 兼容接口。
      config:
        model: text-embedding-v4
        api_key: $DASHSCOPE_API_KEY  # 从 backend/packages/harness/.env 读取千问密钥。
        openai_base_url: https://maas.qianwenaiapi.com/compatible-mode/v1
        embedding_dims: 1024
    vector_store:
      provider: pgvector
      config:
        connection_string: $DATABASE_URL  # 复用业务数据库连接，使用 postgresql:// 格式。
        collection_name: agent_memories_text_embedding_v4  # 与旧模型的记忆表分开。
        embedding_model_dims: 1024  # 与 embedder 的维度一致。

token_usage_enabled: true
loop_detection_enabled: true
token_budget_enabled: false
summarization:
  enabled: true
  trigger_tokens: 200
  keep_messages: 4
  max_input_tokens: 16000
  max_output_tokens: 1000

tool_artifacts:
  enabled: true
  max_entries: 100
